{% extends "base.html" %}

{% block title %}Verify OTP | Palgrimizer AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="glass-card" style="padding: 2.5rem 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.3rem;">
                <i data-lucide="shield-check"></i>
            </div>
            <h2>Verify OTP Code</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
                We sent a 6-digit code to <strong>{{ email }}</strong>
            </p>
            {% if code_preview %}
                <div class="badge badge-success" style="margin-top: 0.5rem; font-size: 0.85rem;">
                    Simulation OTP Code: {{ code_preview }}
                </div>
            {% endif %}
        </div>

        <form action="{{ url_for('auth.verify_otp') }}" method="POST">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group">
                <label class="form-label">6-Digit Verification Code</label>
                <input type="text" class="form-control" name="otp" required placeholder="123456" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.3em; font-family: 'JetBrains Mono', monospace;">
            </div>

            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="new_password" required placeholder="Enter new strong password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
                <i data-lucide="check-circle" style="width: 16px; margin-right: 0.5rem;"></i> Verify OTP & Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
