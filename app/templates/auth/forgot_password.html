{% extends "base.html" %}

{% block title %}Reset Password | Palgrimizer AI{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="glass-card" style="padding: 2.5rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.3rem;">
                <i data-lucide="key"></i>
            </div>
            <h2>Reset Password</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
                Enter your account email to receive a 6-digit OTP verification code
            </p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="fpEmail">Registered Email</label>
                <input type="email" class="form-control" id="fpEmail" name="email" required placeholder="name@company.com">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
                <i data-lucide="send" style="width: 16px; margin-right: 0.5rem;"></i> Send OTP Verification Code
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
            Remembered your password? <a href="{{ url_for('auth.login') }}">Back to Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
