{% extends "base.html" %}

{% block title %}Register | Palgrimizer AI{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
    <div class="glass-card" style="padding: 2.5rem 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.3rem;">
                <i data-lucide="user-plus"></i>
            </div>
            <h2>Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
                Join thousands of enterprise users correcting documents with AI
            </p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="regName">Full Name</label>
                <input type="text" class="form-control" id="regName" name="full_name" required placeholder="Alexander Vance">
            </div>

            <div class="form-group">
                <label class="form-label" for="regEmail">Email Address</label>
                <input type="email" class="form-control" id="regEmail" name="email" required placeholder="alexander@company.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="passwordInput">Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control" id="passwordInput" name="password" required placeholder="At least 8 characters">
                    <button type="button" class="pwd-toggle-btn" data-target="passwordInput" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                        <i data-lucide="eye" style="width: 16px;"></i>
                    </button>
                </div>
                <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
                <div id="strengthText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem;">Password strength</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="regConfirmPassword" name="confirm_password" required placeholder="Re-enter password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
                <i data-lucide="rocket" style="width: 16px; margin-right: 0.5rem;"></i> Create Enterprise Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
